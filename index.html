<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
</head>

<body>
    <div class="caja_principal">
        <div id="div1" class="visible">
            <div class="Caja">
                <div class="Caja2">
                    <div class="Caja2_div1">
                        <img src="img/Logo-Solari.png" alt="Logo del colegio" width="300px" height="250px">
                    </div>

                    <div class="Caja2_div2">
                        <p>Regístrate Ya!</p>
                    </div>

                    <div class="Caja2_div3">
                        <div class="campo">
                            <label for="usuario"><p>Usuario:</p></label>
                            <div class="caja_1">
                                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario">
                            </div>
                        </div>

                        <div class="campo">
                            <label for="password"><p>Contraseña:</p></label>
                            <div class="caja_1">
                                <input type="password" id="password" name="password"
                                    placeholder="Ingresa tu contraseña">
                            </div>
                        </div>

                        <div class="Caja2_div4">
                            <button type="button" class="boton" onclick="mostrar('div2')"><a href="#"
                                    onclick="Inicio()"><p>Regístrate</p></a></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="caja_principal1">
            <div id="div2" class="oculto">
                <div class="caja1">
                    <div class="Caja2">
                        <div class="Caja2_div1">
                            <img src="img/Logo-Solari.png" alt="Logo del colegio" width="300px" height="250px">
                        </div>

                        <div class="Caja2_div2">
                            <p>Iniciar Sesión</p>
                        </div>

                        <div class="Caja2_div3">
                            <div class="campo">
                                <label for="usuario_login"><p>Usuario:</p></label>
                                <div class="caja_1">
                                    <input type="text" id="usuario1" name="usuario1" placeholder="Ingresa tu usuario">
                                </div>
                            </div>

                            <div class="campo">
                                <label for="password_login"><p>Contraseña:</p></label>
                                <div class="caja_1">
                                    <input type="password" id="password1" name="password1"
                                        placeholder="Ingresa tu contraseña">
                                </div>
                            </div>

                            <div class="Caja2_div4">
                                <button class="boton" value="Ingresar" onclick="Inicio1()"><p>Iniciar Sesión</p></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="codigo.js"></script>
</body>

</html>
